<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BUSY Bar Time Tracker</title>
<style>
  :root { color-scheme: dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #111; color: #eee;
    margin: 0; padding: 24px 16px;
    display: flex; flex-direction: column; align-items: center; gap: 24px;
  }
  #state { font-size: 14px; letter-spacing: 0.1em; color: #888; text-transform: uppercase; }
  #elapsed { font-size: 56px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .controls { display: flex; gap: 12px; }
  button {
    font-size: 18px; padding: 14px 28px; border-radius: 10px; border: none;
    background: #2a2a2a; color: #eee; min-width: 96px;
  }
  button:active { background: #3a3a3a; }
  button:disabled { opacity: 0.35; }
  #primary { background: #1f7a3f; }
  #stop { background: #7a2020; }
  input, select {
    font-size: 16px; padding: 10px; border-radius: 8px; border: 1px solid #444;
    background: #1a1a1a; color: #eee; box-sizing: border-box;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%; flex: none;
    background: #555; display: inline-block;
  }
  #label-picker {
    display: flex; align-items: center; gap: 10px; width: 100%; max-width: 320px;
  }
  #label-picker select { flex: 1; }
  #label-panel { display: none; flex-direction: column; align-items: center; gap: 12px; width: 100%; max-width: 320px; }
  .row { display: flex; gap: 12px; width: 100%; }
  #label-panel button { flex: 1; }
  section { width: 100%; max-width: 420px; }
  section h2 { font-size: 13px; color: #888; text-transform: uppercase; letter-spacing: 0.1em; }
  section ul { list-style: none; margin: 0; padding: 0; }
  section li {
    display: flex; align-items: center; gap: 10px; padding: 8px 0;
    border-bottom: 1px solid #222; font-size: 14px;
  }
  .name { color: #eee; flex: 1; }
  .meta { color: #888; }
  #labels-list button {
    font-size: 16px; min-width: 0; padding: 4px 10px; background: none; color: #666;
  }
  #labels-add { margin-top: 12px; }
  #labels-add input[type=text] { flex: 1; min-width: 0; }
  #labels-add input[type=color] { width: 44px; padding: 4px; }
  #labels-add button { min-width: 0; padding: 10px 18px; font-size: 16px; }
</style>
</head>
<body>
  <div id="state">idle</div>
  <div id="elapsed">00:00</div>

  <div id="label-picker">
    <span id="label-dot" class="dot"></span>
    <select id="label-select"></select>
  </div>

  <div class="controls" id="controls">
    <button id="primary">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>

  <div id="label-panel">
    <div class="row">
      <button id="skip">Skip</button>
      <button id="save">Save</button>
    </div>
  </div>

  <section id="labels">
    <h2>Labels</h2>
    <ul id="labels-list"></ul>
    <div class="row" id="labels-add">
      <input id="new-label-name" type="text" placeholder="New label" autocomplete="off">
      <input id="new-label-color" type="color" value="#38BDF8">
      <button id="add-label">Add</button>
    </div>
  </section>

  <section id="sessions">
    <h2>Recent sessions</h2>
    <ul id="sessions-list"></ul>
  </section>

<script>
const stateEl = document.getElementById('state');
const elapsedEl = document.getElementById('elapsed');
const controlsEl = document.getElementById('controls');
const primaryBtn = document.getElementById('primary');
const stopBtn = document.getElementById('stop');
const labelPanel = document.getElementById('label-panel');
const labelSelect = document.getElementById('label-select');
const labelDot = document.getElementById('label-dot');
const saveBtn = document.getElementById('save');
const skipBtn = document.getElementById('skip');
const labelsList = document.getElementById('labels-list');
const newLabelName = document.getElementById('new-label-name');
const newLabelColor = document.getElementById('new-label-color');
const addLabelBtn = document.getElementById('add-label');
const sessionsList = document.getElementById('sessions-list');

const NONE_COLOR = '#555555';

let current = { state: 'IDLE', accumulated_seconds: 0, current_segment_start: null, selected_label: '', labels: [] };
let tickHandle = null;
let renderedLabelsKey = null;

function formatDuration(totalSeconds) {
  totalSeconds = Math.max(0, Math.round(totalSeconds));
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = totalSeconds % 60;
  const mm = String(m).padStart(2, '0');
  const ss = String(s).padStart(2, '0');
  return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}

function liveElapsed() {
  let seconds = current.accumulated_seconds || 0;
  if (current.state === 'RUNNING' && current.current_segment_start) {
    seconds += (Date.now() - Date.parse(current.current_segment_start)) / 1000;
  }
  return seconds;
}

// The device wants #RRGGBBAA; CSS and <input type=color> want #RRGGBB.
function cssColor(color) {
  return color ? color.slice(0, 7) : NONE_COLOR;
}

function colorForLabel(name) {
  const match = (current.labels || []).find((l) => l.name === name);
  return match ? cssColor(match.color) : NONE_COLOR;
}

function renderLabelPicker() {
  const labels = current.labels || [];
  // Only rebuild the <option> list when the label set actually changed, so an open
  // dropdown isn't yanked out from under the user on every incoming snapshot.
  const key = JSON.stringify(labels);
  if (key !== renderedLabelsKey) {
    renderedLabelsKey = key;
    labelSelect.innerHTML = '';
    const none = document.createElement('option');
    none.value = '';
    none.textContent = '— no label —';
    labelSelect.appendChild(none);
    for (const label of labels) {
      const option = document.createElement('option');
      option.value = label.name;
      option.textContent = label.name;
      labelSelect.appendChild(option);
    }
  }
  labelSelect.value = current.selected_label || '';
  labelDot.style.background = colorForLabel(current.selected_label);
}

function renderLabelsManager() {
  labelsList.innerHTML = '';
  for (const label of current.labels || []) {
    const li = document.createElement('li');

    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = cssColor(label.color);

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = label.name;

    const remove = document.createElement('button');
    remove.textContent = '×';
    remove.title = `Delete ${label.name}`;
    remove.addEventListener('click', () => deleteLabel(label.name));

    li.append(dot, name, remove);
    labelsList.appendChild(li);
  }
}

function render() {
  stateEl.textContent = current.state.replace('_', ' ').toLowerCase();

  if (current.state === 'PENDING_LABEL' && current.pending) {
    elapsedEl.textContent = formatDuration(current.pending.total_active_seconds);
  } else {
    elapsedEl.textContent = formatDuration(liveElapsed());
  }

  renderLabelPicker();
  renderLabelsManager();

  controlsEl.style.display = current.state === 'PENDING_LABEL' ? 'none' : 'flex';
  labelPanel.style.display = current.state === 'PENDING_LABEL' ? 'flex' : 'none';

  if (tickHandle) clearInterval(tickHandle);
  if (current.state === 'PENDING_LABEL') return;

  primaryBtn.textContent = current.state === 'RUNNING' ? 'Pause'
    : current.state === 'PAUSED' ? 'Resume' : 'Start';
  stopBtn.disabled = current.state === 'IDLE';

  if (current.state === 'RUNNING') {
    tickHandle = setInterval(() => { elapsedEl.textContent = formatDuration(liveElapsed()); }, 250);
  }
}

function applySnapshot(snapshot) {
  current = snapshot;
  render();
}

async function postAction(path, body) {
  const res = await fetch(path, {
    method: 'POST',
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  applySnapshot(await res.json());
}

primaryBtn.addEventListener('click', () => postAction('/api/actions/start-toggle'));
stopBtn.addEventListener('click', () => postAction('/api/actions/stop'));
labelSelect.addEventListener('change', () => {
  postAction('/api/actions/select-label', { label: labelSelect.value });
});
saveBtn.addEventListener('click', () => postAction('/api/actions/label', { label: labelSelect.value }));
skipBtn.addEventListener('click', () => postAction('/api/actions/label', { label: '' }));

async function refreshLabels() {
  const res = await fetch('/api/state');
  applySnapshot(await res.json());
}

async function addLabel() {
  const name = newLabelName.value.trim();
  if (!name) return;
  await fetch('/api/labels', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, color: newLabelColor.value }),
  });
  newLabelName.value = '';
  refreshLabels();
}

async function deleteLabel(name) {
  await fetch(`/api/labels?name=${encodeURIComponent(name)}`, { method: 'DELETE' });
  refreshLabels();
}

addLabelBtn.addEventListener('click', addLabel);
newLabelName.addEventListener('keydown', (e) => { if (e.key === 'Enter') addLabel(); });

function renderSessions(sessions) {
  sessionsList.innerHTML = '';
  for (const s of sessions) {
    const li = document.createElement('li');

    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = colorForLabel(s.label);

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = s.label || '(no label)';

    const meta = document.createElement('span');
    meta.className = 'meta';
    meta.textContent = formatDuration(s.total_active_seconds);

    li.append(dot, name, meta);
    sessionsList.appendChild(li);
  }
}

async function loadSessions() {
  const res = await fetch('/api/sessions?limit=20');
  renderSessions(await res.json());
}

async function init() {
  const res = await fetch('/api/state');
  applySnapshot(await res.json());
  loadSessions();

  const source = new EventSource('/api/events');
  source.onmessage = (e) => {
    const snapshot = JSON.parse(e.data);
    const wasPending = current.state === 'PENDING_LABEL';
    applySnapshot(snapshot);
    if (wasPending && snapshot.state !== 'PENDING_LABEL') loadSessions();
  };
}

init();
</script>
</body>
</html>
